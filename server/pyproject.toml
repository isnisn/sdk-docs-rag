[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sdk-docs-rag"
version = "1.0.0"
description = "Local CPU-only MCP RAG server for vendor SDK documentation"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andreas Nilsson" }]
dependencies = [
    "mcp>=1.0.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
]

[tool.setuptools]
py-modules = ["server", "ingest", "config"]
